name: Release CraftRoster

on:
  # ZIP builds run on explicit version changes or manual dispatch.
  # Normal source pushes remain covered by .github/workflows/tests.yml.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - CraftRoster.toc
      - tests/test_addon.py

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test tools
        run: python -m pip install -r tests/requirements.txt
      - name: Package addon before validation
        run: python scripts/package_addon.py CraftRoster.zip

      - name: Validate addon and installable ZIP
        run: python -m unittest discover -s tests -v

      - name: Update installable ZIP on main
        if: github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet -- CraftRoster.zip; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CraftRoster.zip
            git commit -m "Rebuild installable CraftRoster ZIP [skip ci]"
            git push
          fi

      - name: Read addon version
        id: metadata
        run: |
          echo "version=$(sed -n 's/^## Version: //p' CraftRoster.toc)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.metadata.outputs.version }}
          name: CraftRoster ${{ steps.metadata.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ contains(steps.metadata.outputs.version, 'beta') }}
          files: CraftRoster.zip
          generate_release_notes: true

